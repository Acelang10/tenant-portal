services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tenant_portal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tenant_portal}
      POSTGRES_DB: ${DB_NAME:-tenant_portal}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
